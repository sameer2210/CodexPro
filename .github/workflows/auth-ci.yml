name: Auth CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - "Backend/**"
      - ".github/workflows/auth-ci.yml"
      - "CodeX_OS/docs/Testing.md"

concurrency:
  group: auth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run --coverage=false
      - run: npm run build

  backend-auth:
    name: Backend Jest auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      JWT_SECRET: codex-auth-test-jwt-secret-32chars-min!!
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      FRONTEND_URLS: http://localhost:5173
      MONGODB_URI: mongodb://127.0.0.1:27017/codex-auth-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-e2e:
    name: Playwright auth E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: Frontend/playwright-report
          retention-days: 7
